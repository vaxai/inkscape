# Performance tests (Linux perf + FlameGraph)
#
# Runs on every pull request targeting master, and on every push/merge to master.
# Uses the official Inkscape CI Docker image so GTK/gtkmm and other deps match
# GitLab CI (avoids Ubuntu 24.04's too-old system gtkmm and incomplete in-tree
# gtkmm bootstrap on stock runners).
#
# Cost: this repository is public, so GitHub Actions minutes are free/unlimited
# for standard GitHub-hosted runners. Private repos get a monthly free allowance
# (extra minutes are billed). Self-hosted runners are always free of GitHub
# minute charges.

name: Performance Tests

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      # Temporary: also run on this feature branch while we iterate on the workflow
      # before a PR exists. Remove once the PR is open and green.
      - feature/perf-flamegraph-reports-svg-only
  workflow_dispatch:

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: RelWithDebInfo
  BUILD_DIR: build-perf
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  PERF_TEST_ITERATIONS: "2"
  PERF_TEST_MAX_TIME: "30"
  PERF_TEST_CALL_STACK_MODE: userspace
  PERF_TEST_POSTPROCESS_TIME: "300"
  # Memory-safe default; inkscape_base TUs are large in RelWithDebInfo.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  performance:
    name: perf + FlameGraph (Inkscape CI image)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Official Inkscape build image (Ubuntu 26.04 + full deps). Privileged so
    # Linux perf can open perf_events inside the container.
    container:
      image: registry.gitlab.com/inkscape/inkscape-ci-docker/master
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install perf + xvfb inside CI image
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # Kernel-specific perf may not match the host kernel; install common + generic.
          apt-get install -y --no-install-recommends \
            ccache \
            linux-tools-common \
            linux-tools-generic \
            xvfb \
            dbus-x11 \
            || true
          # Try exact kernel package when available on this runner image.
          apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" || true

          if ! command -v perf >/dev/null 2>&1; then
            if command -v "perf_$(uname -r)" >/dev/null 2>&1; then
              ln -sf "$(command -v "perf_$(uname -r)")" /usr/local/bin/perf
            else
              # Fallback: any perf_* on PATH
              perf_bin="$(command -v perf_* 2>/dev/null | head -1 || true)"
              if [ -n "${perf_bin}" ]; then
                ln -sf "${perf_bin}" /usr/local/bin/perf
              fi
            fi
          fi
          command -v perf
          perf --version || perf version || true

      - name: Enable perf events
        run: |
          set -eux
          if [ -w /proc/sys/kernel/perf_event_paranoid ]; then
            echo -1 > /proc/sys/kernel/perf_event_paranoid || echo 1 > /proc/sys/kernel/perf_event_paranoid || true
          else
            sysctl -w kernel.perf_event_paranoid=-1 || sysctl -w kernel.perf_event_paranoid=1 || true
          fi
          cat /proc/sys/kernel/perf_event_paranoid || true
          perf record -o /tmp/perf-sanity.data -- sleep 0.1
          perf script -i /tmp/perf-sanity.data | head -3 || true
          rm -f /tmp/perf-sanity.data

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: perf-ccache-ciimg-${{ env.CMAKE_BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'CMakeScripts/**') }}
          restore-keys: |
            perf-ccache-ciimg-${{ env.CMAKE_BUILD_TYPE }}-
            perf-ccache-ciimg-

      - name: Configure (RelWithDebInfo + performance tests)
        run: |
          set -eux
          ccache --zero-stats || true
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_INTERNAL_2GEOM=ON \
            -DBUILD_PERFORMANCE_TESTS=ON \
            -DPERF_TEST_ITERATIONS="${PERF_TEST_ITERATIONS}" \
            -DPERF_TEST_MAX_TIME="${PERF_TEST_MAX_TIME}" \
            -DPERF_TEST_POSTPROCESS_TIME="${PERF_TEST_POSTPROCESS_TIME}" \
            -DPERF_TEST_CALL_STACK_MODE="${PERF_TEST_CALL_STACK_MODE}" \
            2>&1 | tee cmake-configure.log
          grep -E 'Performance testing|Registered .* performance tests|PERF_TESTS_AVAILABLE|gtkmm|GTKMM' \
            cmake-configure.log || true

      - name: Build inkscape
        run: |
          set -eux
          cmake --build "${BUILD_DIR}" --target inkscape 2>&1 | tee build-inkscape.log
          ccache --show-stats || true

      - name: Build integration tests target
        run: |
          set -eux
          cmake --build "${BUILD_DIR}" --target tests 2>&1 | tee build-tests.log

      - name: Build unit_tests target
        run: |
          set -eux
          cmake --build "${BUILD_DIR}" --target unit_tests 2>&1 | tee build-unit_tests.log

      - name: List registered performance tests
        run: |
          set -eux
          ctest --test-dir "${BUILD_DIR}" -N -L performance | tee perf-test-list.txt
          count="$(ctest --test-dir "${BUILD_DIR}" -N -L performance | grep -c 'Test #' || true)"
          echo "Registered performance tests: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "No performance tests were registered; failing so misconfiguration is visible." >&2
            exit 1
          fi

      - name: Run performance tests
        run: |
          set -eux
          if [ -w /proc/sys/kernel/perf_event_paranoid ]; then
            echo -1 > /proc/sys/kernel/perf_event_paranoid || true
          else
            sysctl -w kernel.perf_event_paranoid=-1 || true
          fi

          export LIBGL_ALWAYS_SOFTWARE=1
          # xvfb may be optional for pure unit tests but is needed for rendering/CLI paths.
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a --server-args="-screen 0 1024x768x24" \
              ctest --test-dir "${BUILD_DIR}" \
                -L performance \
                --output-on-failure \
                --timeout $(( PERF_TEST_MAX_TIME + PERF_TEST_POSTPROCESS_TIME )) \
                -j1 2>&1 | tee ctest-performance.log
          else
            ctest --test-dir "${BUILD_DIR}" \
              -L performance \
              --output-on-failure \
              --timeout $(( PERF_TEST_MAX_TIME + PERF_TEST_POSTPROCESS_TIME )) \
              -j1 2>&1 | tee ctest-performance.log
          fi

      - name: Summarize flame graphs
        if: always()
        run: |
          set -eux
          report_dir="${BUILD_DIR}/performance_reports"
          if [ -d "${report_dir}" ]; then
            echo "=== Flame graph SVGs ==="
            find "${report_dir}" -name '*.svg' -type f | sort | tee perf-report-index.txt
            echo "Count: $(find "${report_dir}" -name '*.svg' -type f | wc -l)"
          else
            echo "No performance_reports directory found." | tee perf-report-index.txt
          fi

      - name: Upload flame graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-flamegraphs-${{ github.run_id }}
          path: |
            ${{ env.BUILD_DIR }}/performance_reports/
            perf-test-list.txt
            perf-report-index.txt
            ctest-performance.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build / CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-failure-logs-${{ github.run_id }}
          path: |
            cmake-configure.log
            build-inkscape.log
            build-tests.log
            build-unit_tests.log
            ctest-performance.log
            ${{ env.BUILD_DIR }}/Testing/Temporary/
            perf-test-list.txt
            perf-report-index.txt
          if-no-files-found: ignore
          retention-days: 14
